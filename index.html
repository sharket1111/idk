<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rhythm Brawl</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #2a1a34; color: #d8c8e8; font-family: sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
    .help { font-size: 12px; margin-top: 10px; text-align: center; line-height: 1.7; }
    kbd { background: #4a3458; border-radius: 3px; padding: 0 4px; color: #fff; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="help">
    P1: <kbd>D</kbd> 펀치(♥) · <kbd>F</kbd> 킥(★) &nbsp;|&nbsp; P2: <kbd>J</kbd> 펀치 · <kbd>K</kbd> 킥 (CPU 상대일 땐 P1도 J/K 사용 가능)<br />
    공격 마디: 노트에 맞춰 공격 → 다음 마디에 같은 리듬으로 날아감 · 방어 마디: 같은 버튼으로 막기 (완벽하면 패링)<br />
    <kbd>Enter</kbd> 시작 · <kbd>F2</kbd>/<kbd>F4</kbd> 캐릭터 · <kbd>F1</kbd> P2 CPU/사람 · <kbd>[</kbd> <kbd>]</kbd> 싱크 조절
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
